[project]
name = "azuregos-backend"
version = "0.1.0"
description = "Azuregos — a service-desk front end for Azure DevOps"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "psycopg2-binary==2.9.9",
    "passlib==1.7.4",
    # Pinned: passlib 1.7.4 reads bcrypt.__about__, removed in bcrypt >= 4.1.
    "bcrypt==4.0.1",
    "pyjwt==2.9.0",
    "python-multipart==0.0.9",
    "httpx==0.27.2",
    "authlib==1.3.2",
    "celery[redis]==5.4.0",
    "redis==5.0.8",
    "python3-saml==1.16.0",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.8",
    "watchdog==5.0.3",
    "aiosqlite==0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
