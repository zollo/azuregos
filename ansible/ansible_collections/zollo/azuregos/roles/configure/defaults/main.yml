---
# Connection (see meta/argument_specs.yml for every option).
# azuregos_url: https://azuregos.example.com
# azuregos_token: ...            # or azuregos_username + azuregos_password
azuregos_validate_certs: true
azuregos_wait_timeout: 300

# What to configure. Each item takes the options of the module of the same
# name (zollo.azuregos.category, .portal, .user, .ado_connection), plus
# `category` (a name) on portals and `portals` (names) on users.
# Unset options are left as they are; `state: absent` deletes.
# azuregos_ado_connection:
#   org_url: https://dev.azure.com/contoso
#   pat: "{{ vault_ado_pat }}"
#   default_project: IT
azuregos_categories: []
azuregos_portals: []
azuregos_users: []
