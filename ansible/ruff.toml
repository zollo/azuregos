# Lint for the generator and its tests. The collection's own code is checked
# by `ansible-test sanity` (pep8, pylint, validate-modules) instead.
line-length = 100
target-version = "py311"
extend-exclude = ["ansible_collections"]

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.isort]
known-third-party = ["ansible_collections"]
