name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest -q

  frontend:
    name: Frontend — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Type-check & build
        run: npm run build
      - name: Test
        run: npm test

  smoke:
    name: Smoke — stack health
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: cp .env.example .env
      - name: Start API + Postgres + Redis
        # Base compose only (no dev override): builds the prod backend image,
        # runs migrations, and boots uvicorn against ephemeral PG/Redis.
        run: docker compose -f docker-compose.yml up -d --build backend
      - name: Wait for readiness
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1; then
              echo "API is up (attempt $i)"; break
            fi
            echo "waiting for API... ($i)"; sleep 3
          done
          echo "== /api/health =="
          curl -fsS http://localhost:8000/api/health | tee /tmp/health.json; echo
          echo "== /api/health/ready =="
          curl -fsS http://localhost:8000/api/health/ready | tee /tmp/ready.json; echo
          jq -e '.status == "ok"' /tmp/health.json
          jq -e '.database == true' /tmp/ready.json
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  images:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [backend, frontend, smoke]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
