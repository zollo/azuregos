name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege by default; jobs opt into more as needed.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest -q

  frontend:
    name: Frontend — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Type-check & build
        run: npm run build
      - name: Test
        run: npm test

  smoke:
    name: Smoke — stack health
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: cp .env.example .env
      - name: Start API + Postgres + Redis
        # Base compose only (no dev override): builds the prod backend image,
        # runs migrations, and boots uvicorn against ephemeral PG/Redis.
        run: docker compose -f docker-compose.yml up -d --build backend
      - name: Wait for readiness
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1; then
              echo "API is up (attempt $i)"; break
            fi
            echo "waiting for API... ($i)"; sleep 3
          done
          echo "== /api/health =="
          curl -fsS http://localhost:8000/api/health | tee /tmp/health.json; echo
          echo "== /api/health/ready =="
          curl -fsS http://localhost:8000/api/health/ready | tee /tmp/ready.json; echo
          jq -e '.status == "ok"' /tmp/health.json
          jq -e '.database == true' /tmp/ready.json
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # Version & release on merges to main. The first release is seeded at v1.0.0;
  # afterwards the next version is computed from commit history (Conventional
  # Commits: feat: -> minor, fix: -> patch, BREAKING CHANGE -> major; default
  # patch).
  version:
    name: Version & tag
    runs-on: ubuntu-latest
    needs: [backend, frontend, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.final.outputs.version }}
      tag: ${{ steps.final.outputs.tag }}
      major_minor: ${{ steps.final.outputs.major_minor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for existing version tags
        id: check
        run: |
          if [ -z "$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*')" ]; then
            echo "seed=true" >> "$GITHUB_OUTPUT"
          else
            echo "seed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Seed initial version (v1.0.0)
        if: steps.check.outputs.seed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a v1.0.0 -m "Release v1.0.0"
          git push origin v1.0.0
      - name: Determine next version
        id: tag
        if: steps.check.outputs.seed == 'false'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
      - name: Resolve version outputs
        id: final
        run: |
          if [ "${{ steps.check.outputs.seed }}" = "true" ]; then
            VERSION=1.0.0
            TAG=v1.0.0
          else
            VERSION='${{ steps.tag.outputs.new_version }}'
            TAG='${{ steps.tag.outputs.new_tag }}'
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "major_minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        if: steps.final.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.final.outputs.tag }}
          name: ${{ steps.final.outputs.tag }}
          generate_release_notes: true

  images:
    name: Build, sign & attest images
    runs-on: ubuntu-latest
    needs: [version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write        # push images to GHCR
      id-token: write         # keyless cosign signing + attestation (OIDC)
      attestations: write     # store build provenance attestation
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=${{ needs.version.outputs.major_minor }}
            type=sha,format=short
      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign image (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
