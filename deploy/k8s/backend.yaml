apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: azuregos
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Pull secret for the private GHCR images (see README → Kubernetes).
      imagePullSecrets:
        - name: ghcr-pull
      # Run DB migrations before the API starts.
      initContainers:
        - name: migrate
          image: ghcr.io/zollo/azuregos-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: azuregos-config
            - secretRef:
                name: azuregos-secrets
      containers:
        - name: backend
          image: ghcr.io/zollo/azuregos-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: azuregos-config
            - secretRef:
                name: azuregos-secrets
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: azuregos
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
