apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: azuregos
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Build this image with --build-arg VITE_API_BASE_URL=<public API URL>
          image: ghcr.io/zollo/azuregos-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: azuregos
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
