apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: azuregos

resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - worker.yaml
  - frontend.yaml
  - ingress.yaml

# Override image tags per environment, e.g.:
#   kustomize edit set image ghcr.io/OWNER/azuregos-backend=ghcr.io/acme/azuregos-backend:v1.2.3
images:
  - name: ghcr.io/OWNER/azuregos-backend
    newTag: latest
  - name: ghcr.io/OWNER/azuregos-frontend
    newTag: latest
