[project]
name = "azuregos-mcp"
version = "0.1.0"
description = "MCP server exposing the Azuregos API as tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "httpx>=0.27,<1",
    "jsonschema>=4.20",
    "anyio>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.8",
]

[project.scripts]
azuregos-mcp = "azuregos_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["azuregos_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["azuregos_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
