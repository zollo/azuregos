apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "azuregos.fullname" . }}-worker
  labels:
    {{- include "azuregos.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # One replica only: the worker also runs Celery beat (the ADO retry loop),
  # which would double-fire with more. Scale with worker.concurrency.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "azuregos.selectorLabels" (list . "worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "azuregos.configChecksum" . | nindent 8 }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "azuregos.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "azuregos.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "azuregos.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - celery
            - -A
            - app.workers.celery_app.celery_app
            - worker
            - --beat
            - --schedule=/tmp/celerybeat-schedule
            - --concurrency={{ .Values.worker.concurrency }}
            - --loglevel=info
          envFrom:
            {{- include "azuregos.envFrom" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.worker.securityContext | nindent 12 }}
          {{- with .Values.worker.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
