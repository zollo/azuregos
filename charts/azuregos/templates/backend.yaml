apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "azuregos.fullname" . }}-backend
  labels:
    {{- include "azuregos.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "azuregos.selectorLabels" (list . "backend") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "azuregos.configChecksum" . | nindent 8 }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "azuregos.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "azuregos.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      {{- if .Values.backend.migrate }}
      initContainers:
        - name: migrate
          image: {{ include "azuregos.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Retry while the database starts (first install, node restarts).
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 60); do
                alembic upgrade head && exit 0
                echo "migration failed, retrying in 5s ($i/60)"; sleep 5
              done
              exit 1
          envFrom:
            {{- include "azuregos.envFrom" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      {{- end }}
      containers:
        - name: backend
          image: {{ include "azuregos.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            {{- include "azuregos.envFrom" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "azuregos.fullname" . }}-backend
  labels:
    {{- include "azuregos.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "azuregos.selectorLabels" (list . "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.backendPort }}
      targetPort: http
