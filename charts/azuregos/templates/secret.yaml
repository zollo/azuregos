{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "azuregos.secretName" . }}
  labels:
    {{- include "azuregos.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secrets.SECRET_KEY is required (or set existingSecret)" .Values.secrets.SECRET_KEY | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.POSTGRES_PASSWORD is required (or set existingSecret)" .Values.secrets.POSTGRES_PASSWORD | quote }}
  {{- range $key, $value := omit .Values.secrets "SECRET_KEY" "POSTGRES_PASSWORD" }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
